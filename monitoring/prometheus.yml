global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cansat            # telemetria del dashboard (endpoint /metrics)
    scrape_interval: 5s
    static_configs:
      - targets: ["dashboard:8000"]

  - job_name: node              # solo con el perfil "server"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor          # solo con el perfil "server"
    static_configs:
      - targets: ["cadvisor:8080"]
